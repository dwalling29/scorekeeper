<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Judges Beer League">
  <title>Judges Beer League App</title>
  <style>
    :root {
      --ink:#162431;
      --muted:#526679;
      --accent:#123b5d;
      --line:#cdd8e3;
      --paper:#ffffff;
      --bg:#eaf0f5;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    .app-shell { max-width:1500px; margin:0 auto; padding:14px 12px 22px; }
    .topbar {
      display:flex; gap:12px; align-items:center; justify-content:space-between;
      background:var(--paper); border:1px solid var(--line); border-radius:12px;
      padding:12px; margin-bottom:12px; box-shadow:0 3px 16px rgba(15,34,53,.10);
      position:sticky; top:0; z-index:9999;
    }
    .brand { min-width:0; }
    .brand h1 { margin:0; color:var(--accent); font-size:20px; letter-spacing:.02em; }
    .brand p { margin:3px 0 0; color:var(--muted); font-size:12px; }
    .nav { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    button {
      border:1.5px solid var(--accent); border-radius:9px; padding:10px 13px;
      font-weight:700; background:#fff; color:var(--accent); cursor:pointer; font-size:14px;
    }
    button.active, button.primary { background:var(--accent); color:#fff; }
    .frame-wrap { display:none; background:#fff; border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:0 3px 16px rgba(15,34,53,.10); }
    .frame-wrap.active { display:block; }
    iframe { display:block; width:100%; height:calc(100vh - 108px); min-height:720px; border:0; background:#fff; }
    .note { color:var(--muted); font-size:12px; margin:10px 3px 0; text-align:center; }
    @media (max-width: 700px) {
      .topbar { display:block; position:static; }
      .brand { text-align:center; margin-bottom:10px; }
      .nav { display:grid; grid-template-columns:1fr 1fr; }
      .nav button:last-child { grid-column:1/-1; }
      iframe { height:calc(100vh - 150px); min-height:650px; }
    }
    @media print {
      .topbar, .note { display:none !important; }
      .app-shell { padding:0; max-width:none; }
      .frame-wrap { display:block !important; border:0; box-shadow:none; }
      .frame-wrap:not(.active) { display:none !important; }
      iframe { height:100vh; min-height:0; }
    }
  </style>
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1>Judges Beer League</h1>
        <p>One-file app: league dashboard + bowling score sheet</p>
      </div>
      <nav class="nav" aria-label="App sections">
        <button id="btnLeague" class="active" type="button">League Manager</button>
        <button id="btnScore" type="button">Score Sheet</button>
        <button id="btnPrint" class="primary" type="button">Print Current View</button>
      </nav>
    </header>

    <section id="leagueWrap" class="frame-wrap active" aria-label="League Manager">
      <iframe id="leagueFrame" title="League Manager"></iframe>
    </section>
    <section id="scoreWrap" class="frame-wrap" aria-label="Score Sheet">
      <iframe id="scoreFrame" title="Score Sheet"></iframe>
    </section>

    <p class="note">Tip: all saves are stored in this browser/device. Use the built-in export buttons inside each app for backups.</p>
  </main>

  <script>
    const leagueHtml = "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n  <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n  <meta name=\"apple-mobile-web-app-title\" content=\"League\">\n  <title>Thursday Bowling League #1<\/title>\n  <style>\n    * { box-sizing: border-box; }\n    :root {\n      --ink:#162431; --accent:#123b5d; --accent-soft:#e8eef5;\n      --paper:#ffffff; --bg:#eaf0f5; --line:#cdd8e3;\n      --focus:#f3c76a; --danger:#aa2834; --win:#1d7a46; --muted:#5b6b7a;\n    }\n    body {\n      margin:0; background:var(--bg); color:var(--ink);\n      font-family:Arial, Helvetica, sans-serif; line-height:1.4;\n    }\n    .page { max-width:1000px; margin:0 auto; padding:18px 16px 60px; }\n    h1 { font-size:24px; margin:0; letter-spacing:.01em; }\n    .sub { color:var(--muted); font-size:14px; margin:4px 0 14px; }\n    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }\n    .tab {\n      flex:1 1 auto; min-width:120px; padding:12px 14px; border:1.5px solid var(--accent);\n      background:var(--paper); color:var(--accent); font-weight:bold; font-size:16px;\n      border-radius:10px; cursor:pointer;\n    }\n    .tab.active { background:var(--accent); color:#fff; }\n    .view { display:none; }\n    .view.active { display:block; }\n    .card { background:var(--paper); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }\n    .card h2 { font-size:18px; margin:0 0 10px; color:var(--accent); }\n\n    table { width:100%; border-collapse:collapse; }\n    th, td { padding:10px 8px; text-align:center; border-bottom:1px solid var(--line); }\n    th { background:var(--accent); color:#fff; font-size:14px; }\n    th:first-child, td:first-child { text-align:left; }\n    tbody tr:nth-child(even) { background:var(--accent-soft); }\n    .team-name { font-weight:bold; }\n    .rank { width:34px; color:var(--muted); }\n    .wlnum { font-weight:bold; font-size:16px; }\n\n    .toolbar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }\n    button.btn {\n      padding:10px 14px; border-radius:8px; border:1.5px solid var(--accent);\n      background:var(--paper); color:var(--accent); font-weight:bold; cursor:pointer; font-size:14px;\n    }\n    button.btn.solid { background:var(--accent); color:#fff; }\n    button.btn.warn { border-color:var(--danger); color:var(--danger); }\n    .status { margin-left:auto; color:var(--muted); font-size:13px; border:1px solid var(--line); border-radius:999px; padding:6px 12px; }\n\n    /* schedule */\n    .week { margin-bottom:14px; }\n    .week h3 { margin:0 0 8px; color:var(--accent); font-size:16px; border-bottom:2px solid var(--accent-soft); padding-bottom:4px; }\n    .slot-label { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin:8px 0 4px; }\n    .game { display:flex; align-items:center; gap:8px; margin:6px 0; }\n    .pick {\n      flex:1; padding:12px 8px; border:1.5px solid var(--line); background:var(--paper);\n      border-radius:8px; cursor:pointer; font-size:15px; font-weight:bold; color:var(--ink);\n    }\n    .pick.win { background:var(--win); border-color:var(--win); color:#fff; }\n    .pick.lose { opacity:.55; }\n    .vs { color:var(--muted); font-weight:bold; font-size:13px; }\n    .money { padding:12px; border:1.5px dashed var(--accent); border-radius:8px; text-align:center; font-weight:bold; color:var(--accent); background:var(--accent-soft); }\n\n    /* best games */\n    .wk-picker { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }\n    .wk-btn { padding:8px 12px; border:1.5px solid var(--accent); background:var(--paper); color:var(--accent); border-radius:8px; font-weight:bold; cursor:pointer; }\n    .wk-btn.active { background:var(--accent); color:#fff; }\n    .bg-add { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap; }\n    .bg-add input { padding:10px; border:1.5px solid var(--line); border-radius:8px; font-size:15px; }\n    .bg-add input.name { flex:1; min-width:140px; }\n    .bg-add input.score { width:90px; }\n    .bg-row { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid var(--line); }\n    .bg-row .pos { width:26px; color:var(--muted); font-weight:bold; }\n    .bg-row .nm { flex:1; font-weight:bold; }\n    .bg-row .sc { font-weight:bold; font-size:16px; }\n    .bg-row .x { color:var(--danger); cursor:pointer; border:none; background:none; font-size:18px; }\n    .empty { color:var(--muted); font-style:italic; padding:8px 4px; }\n    input.edit-name { font:inherit; font-weight:bold; padding:6px 8px; border:1.5px solid var(--line); border-radius:6px; width:100%; }\n    .hint { color:var(--muted); font-size:13px; margin-top:6px; }\n    .footer { color:var(--muted); font-size:12px; text-align:center; margin-top:24px; }\n    .badge { display:inline-block; min-width:24px; text-align:center; padding:4px 8px; border-radius:6px; font-weight:bold; color:#fff; font-size:13px; }\n    .badge.w { background:var(--win); }\n    .badge.l { background:var(--danger); }\n    @media print {\n      .tabs, .toolbar, .x, .pick, .bg-add, .wk-picker, button { display:none !important; }\n      .view { display:block !important; }\n      .card { break-inside:avoid; }\n    }\n  <\/style>\n<\/head>\n<body>\n  <div class=\"page\">\n    <h1>Thursday Bowling League #1<\/h1>\n    <p class=\"sub\">6 teams &middot; two games each Thursday (7pm &amp; 8pm) &middot; head-to-head win/loss<\/p>\n\n    <div class=\"toolbar\">\n      <button class=\"btn solid\" id=\"btnExport\">Export<\/button>\n      <button class=\"btn\" id=\"btnImport\">Import<\/button>\n      <button class=\"btn\" id=\"btnPrint\">Print<\/button>\n      <button class=\"btn warn\" id=\"btnReset\">Reset Season<\/button>\n      <span class=\"status\" id=\"status\">Saved<\/span>\n      <input type=\"file\" id=\"importFile\" accept=\"application/json\" style=\"display:none\">\n    <\/div>\n\n    <div class=\"tabs\">\n      <button class=\"tab active\" data-view=\"standings\">Standings<\/button>\n      <button class=\"tab\" data-view=\"schedule\">Schedule<\/button>\n      <button class=\"tab\" data-view=\"best\">Best Games<\/button>\n      <button class=\"tab\" data-view=\"stats\">Team Stats<\/button>\n    <\/div>\n\n    <section class=\"view active\" id=\"view-standings\">\n      <div class=\"card\">\n        <h2>Standings<\/h2>\n        <table>\n          <thead><tr><th class=\"rank\">#<\/th><th>Team<\/th><th>W<\/th><th>L<\/th><th>Win %<\/th><\/tr><\/thead>\n          <tbody id=\"standingsBody\"><\/tbody>\n        <\/table>\n        <div class=\"toolbar\" style=\"margin-top:12px;\">\n          <button class=\"btn\" id=\"btnEditTeams\">Edit Team Names<\/button>\n        <\/div>\n        <p class=\"hint\">Standings update automatically as you set winners on the Schedule tab.<\/p>\n      <\/div>\n    <\/section>\n\n    <section class=\"view\" id=\"view-schedule\">\n      <div class=\"card\">\n        <h2>Schedule<\/h2>\n        <p class=\"hint\">Tap the team that won each game. Tap it again to clear. Add or fix matchups anytime.<\/p>\n        <div id=\"scheduleBody\"><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"view\" id=\"view-best\">\n      <div class=\"card\">\n        <h2>Best Game of the Week<\/h2>\n        <div class=\"wk-picker\" id=\"wkPicker\"><\/div>\n        <div class=\"bg-add\">\n          <input class=\"name\" id=\"bgName\" type=\"text\" placeholder=\"Bowler name\">\n          <input class=\"score\" id=\"bgScore\" type=\"number\" inputmode=\"numeric\" placeholder=\"Score\" min=\"0\" max=\"300\">\n          <button class=\"btn solid\" id=\"bgAdd\">Add<\/button>\n        <\/div>\n        <div id=\"bestList\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <h2>Season Top 5<\/h2>\n        <div id=\"seasonTop\"><\/div>\n      <\/div>\n    <\/section>\n\n    <section class=\"view\" id=\"view-stats\">\n      <div class=\"card\">\n        <h2>Team Stats<\/h2>\n        <div style=\"overflow-x:auto;\">\n          <table>\n            <thead><tr><th>Team<\/th><th>GP<\/th><th>W<\/th><th>L<\/th><th>Win %<\/th><th>Streak<\/th><th>7pm<\/th><th>8pm<\/th><th>Best Run<\/th><\/tr><\/thead>\n            <tbody id=\"statsBody\"><\/tbody>\n          <\/table>\n        <\/div>\n        <p class=\"hint\">All of this is figured from the winners you set on the Schedule tab.<\/p>\n      <\/div>\n      <div class=\"card\">\n        <h2>Team Detail<\/h2>\n        <div class=\"wk-picker\" id=\"statsPicker\"><\/div>\n        <h3 style=\"color:var(--accent);font-size:15px;margin:12px 0 6px;\">Recent form<\/h3>\n        <div id=\"statsForm\"><\/div>\n        <h3 style=\"color:var(--accent);font-size:15px;margin:16px 0 6px;\">Head-to-head<\/h3>\n        <div id=\"statsH2H\"><\/div>\n      <\/div>\n      <div class=\"card\">\n        <h2>Bowler Scores<\/h2>\n        <p class=\"hint\">Pick a bowler, then type each game's score. Totals, average, and high game add up on their own.<\/p>\n        <div class=\"wk-picker\" id=\"bowlerPicker\"><\/div>\n        <div id=\"bowlerCard\"><\/div>\n      <\/div>\n    <\/section>\n\n    <p class=\"footer\">Scores are saved on this device. Use Export to back up or share.<\/p>\n  <\/div>\n\n  <script>\n  (() => {\n    const STORAGE_KEY = \"thursdayBowlingLeague_v1\";\n\n    const DEFAULTS = {\n      teams: [\n        {id:1, name:\"Munsons\", bowlers:[\"Casey\",\"Doug\"]},\n        {id:2, name:\"Slippery Willy's\", bowlers:[\"Bill\",\"Billy\"]},\n        {id:3, name:\"Split On Your Face!\", bowlers:[\"Tim\",\"Shannon\"]},\n        {id:4, name:\"All 3 Fingers\", bowlers:[\"Mike\",\"Josh\"]},\n        {id:5, name:\"Balls-N-Dolls\", bowlers:[\"Stephanie\",\"Alex\"]},\n        {id:6, name:\"2 Guys-1 Lane\", bowlers:[\"Steve\",\"Benny\"]}\n      ],\n      games: [\n        {wk:1, slot:'7pm', a:2, b:1, w:1},\n        {wk:1, slot:'7pm', a:3, b:4, w:4},\n        {wk:1, slot:'8pm', a:3, b:6, w:3},\n        {wk:1, slot:'8pm', a:4, b:5, w:5},\n        {wk:2, slot:'7pm', a:6, b:4, w:4},\n        {wk:2, slot:'7pm', a:2, b:5, w:5},\n        {wk:2, slot:'8pm', a:2, b:3, w:3},\n        {wk:2, slot:'8pm', a:6, b:1, w:1},\n        {wk:3, slot:'7pm', a:6, b:2, w:2},\n        {wk:3, slot:'7pm', a:3, b:4, w:3},\n        {wk:3, slot:'8pm', a:5, b:3, w:3},\n        {wk:3, slot:'8pm', a:4, b:1, w:4},\n        {wk:4, slot:'7pm', a:4, b:2, w:4},\n        {wk:4, slot:'7pm', a:3, b:1, w:1},\n        {wk:4, slot:'8pm', a:2, b:1, w:1},\n        {wk:4, slot:'8pm', a:5, b:6, w:6},\n        {wk:5, slot:'7pm', a:4, b:5, w:5},\n        {wk:5, slot:'7pm', a:1, b:3, w:3},\n        {wk:5, slot:'8pm', a:2, b:4, w:2},\n        {wk:5, slot:'8pm', a:6, b:1, w:1},\n        {wk:6, slot:'7pm', a:6, b:4, w:null},\n        {wk:6, slot:'7pm', a:2, b:5, w:null},\n        {wk:6, slot:'8pm', a:1, b:5, w:null},\n        {wk:6, slot:'8pm', a:3, b:2, w:null},\n        {wk:7, slot:'7pm', a:5, b:3, w:null},\n        {wk:7, slot:'7pm', a:6, b:2, w:null},\n        {wk:7, slot:'8pm', a:4, b:1, w:null},\n        {wk:7, slot:'8pm', a:5, b:6, w:null},\n        {wk:8, slot:'7pm', a:3, b:6, w:null},\n        {wk:8, slot:'7pm', a:1, b:5, w:null},\n        {wk:8, slot:'8pm', money:true}\n      ],\n      best: {},   // { weekNumber: [ {name, score} ] }\n      scores: {}  // { \"teamId-bowlerIdx\": { week: [game7pm, game8pm] } }\n    };\n\n    let state = load();\n    let activeWeek = 1;\n    let editTeams = false;\n\n    function load() {\n      try {\n        const raw = localStorage.getItem(STORAGE_KEY);\n        if (raw) return normalize(JSON.parse(raw));\n      } catch (e) {}\n      return clone(DEFAULTS);\n    }\n    function normalize(s) {\n      const out = {\n        teams: s.teams || clone(DEFAULTS.teams),\n        games: s.games || clone(DEFAULTS.games),\n        best: s.best || {},\n        scores: s.scores || {}\n      };\n      out.teams.forEach(t => {\n        if (!Array.isArray(t.bowlers) || t.bowlers.length < 2) {\n          const def = DEFAULTS.teams.find(d => d.id === t.id);\n          t.bowlers = def ? def.bowlers.slice() : [\"\", \"\"];\n        }\n      });\n      return out;\n    }\n    function clone(x){ return JSON.parse(JSON.stringify(x)); }\n    function save() {\n      try {\n        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));\n        setStatus(\"Saved\");\n      } catch (e) { setStatus(\"Could not save\"); }\n    }\n    function setStatus(t){ const s=document.getElementById(\"status\"); if(s) s.textContent=t; }\n    function teamName(id){ const t=state.teams.find(t=>t.id===id); return t?t.name:(\"Team \"+id); }\n\n    /* ---------- Standings ---------- */\n    function computeStandings() {\n      const rec = {};\n      state.teams.forEach(t => rec[t.id] = {id:t.id, name:t.name, w:0, l:0});\n      state.games.forEach(g => {\n        if (g.money || g.w == null) return;\n        if (!rec[g.a] || !rec[g.b]) return;\n        const loser = g.w === g.a ? g.b : g.a;\n        if (rec[g.w]) rec[g.w].w++;\n        if (rec[loser]) rec[loser].l++;\n      });\n      const arr = Object.values(rec);\n      arr.forEach(r => r.pct = (r.w + r.l) ? r.w/(r.w+r.l) : 0);\n      arr.sort((a,b) => b.w - a.w || b.pct - a.pct || a.name.localeCompare(b.name));\n      return arr;\n    }\n    function renderStandings() {\n      const body = document.getElementById(\"standingsBody\");\n      const rows = computeStandings();\n      body.innerHTML = rows.map((r,i) => {\n        const pct = (r.w+r.l) ? (r.pct*100).toFixed(0)+\"%\" : \"&ndash;\";\n        const nameCell = editTeams\n          ? `<input class=\"edit-name\" data-team=\"${r.id}\" value=\"${escapeHtml(r.name)}\">`\n          : `<span class=\"team-name\">${escapeHtml(r.name)}<\/span>`;\n        return `<tr><td class=\"rank\">${i+1}<\/td><td>${nameCell}<\/td>\n          <td class=\"wlnum\">${r.w}<\/td><td class=\"wlnum\">${r.l}<\/td><td>${pct}<\/td><\/tr>`;\n      }).join(\"\");\n      if (editTeams) {\n        body.querySelectorAll(\".edit-name\").forEach(inp => {\n          inp.addEventListener(\"input\", () => {\n            const id = Number(inp.dataset.team);\n            const t = state.teams.find(t=>t.id===id);\n            if (t) { t.name = inp.value; save(); }\n          });\n        });\n      }\n    }\n\n    /* ---------- Schedule ---------- */\n    function renderSchedule() {\n      const host = document.getElementById(\"scheduleBody\");\n      const weeks = [...new Set(state.games.map(g=>g.wk))].sort((a,b)=>a-b);\n      host.innerHTML = weeks.map(wk => {\n        const slots = [\"7pm\",\"8pm\"];\n        const slotHtml = slots.map(slot => {\n          const gs = state.games.filter(g => g.wk===wk && g.slot===slot);\n          if (!gs.length) return \"\";\n          const items = gs.map(g => {\n            const idx = state.games.indexOf(g);\n            if (g.money) return `<div class=\"money\">&#128176; Money Night<\/div>`;\n            const aWin = g.w===g.a, bWin = g.w===g.b, decided = g.w!=null;\n            const aCls = \"pick\" + (aWin?\" win\":(decided?\" lose\":\"\"));\n            const bCls = \"pick\" + (bWin?\" win\":(decided?\" lose\":\"\"));\n            return `<div class=\"game\">\n              <button class=\"${aCls}\" data-game=\"${idx}\" data-team=\"${g.a}\">${escapeHtml(teamName(g.a))}<\/button>\n              <span class=\"vs\">vs<\/span>\n              <button class=\"${bCls}\" data-game=\"${idx}\" data-team=\"${g.b}\">${escapeHtml(teamName(g.b))}<\/button>\n            <\/div>`;\n          }).join(\"\");\n          return `<div class=\"slot-label\">${slot}<\/div>${items}`;\n        }).join(\"\");\n        return `<div class=\"week\"><h3>Week ${wk}<\/h3>${slotHtml}<\/div>`;\n      }).join(\"\");\n\n      host.querySelectorAll(\".pick\").forEach(btn => {\n        btn.addEventListener(\"click\", () => {\n          const idx = Number(btn.dataset.game);\n          const team = Number(btn.dataset.team);\n          const g = state.games[idx];\n          if (!g) return;\n          g.w = (g.w === team) ? null : team;   // toggle off if same\n          save();\n          renderSchedule();\n          renderStandings();\n          renderStats();\n        });\n      });\n    }\n\n    /* ---------- Best Games ---------- */\n    function renderWeekPicker() {\n      const host = document.getElementById(\"wkPicker\");\n      const weeks = [...new Set(state.games.map(g=>g.wk))].sort((a,b)=>a-b);\n      host.innerHTML = weeks.map(wk =>\n        `<button class=\"wk-btn ${wk===activeWeek?'active':''}\" data-wk=\"${wk}\">Wk ${wk}<\/button>`\n      ).join(\"\");\n      host.querySelectorAll(\".wk-btn\").forEach(b => {\n        b.addEventListener(\"click\", () => { activeWeek = Number(b.dataset.wk); renderWeekPicker(); renderBestList(); });\n      });\n    }\n    function renderBestList() {\n      const host = document.getElementById(\"bestList\");\n      const list = (state.best[activeWeek] || []).slice().sort((a,b)=>b.score-a.score);\n      if (!list.length) { host.innerHTML = `<div class=\"empty\">No scores for Week ${activeWeek} yet.<\/div>`; }\n      else {\n        host.innerHTML = list.map((e,i) =>\n          `<div class=\"bg-row\"><span class=\"pos\">${i+1}<\/span>\n            <span class=\"nm\">${escapeHtml(e.name)}<\/span>\n            <span class=\"sc\">${e.score}<\/span>\n            <button class=\"x\" data-wk=\"${activeWeek}\" data-i=\"${i}\" title=\"Remove\">&times;<\/button><\/div>`\n        ).join(\"\");\n        host.querySelectorAll(\".x\").forEach(x => {\n          x.addEventListener(\"click\", () => {\n            const arr = (state.best[activeWeek]||[]).slice().sort((a,b)=>b.score-a.score);\n            arr.splice(Number(x.dataset.i),1);\n            state.best[activeWeek] = arr;\n            save(); renderBestList(); renderSeasonTop();\n          });\n        });\n      }\n    }\n    function renderSeasonTop() {\n      const host = document.getElementById(\"seasonTop\");\n      const all = [];\n      Object.keys(state.best).forEach(wk => (state.best[wk]||[]).forEach(e => all.push({wk, name:e.name, score:e.score})));\n      all.sort((a,b)=>b.score-a.score);\n      const top = all.slice(0,5);\n      if (!top.length) { host.innerHTML = `<div class=\"empty\">Add weekly scores to build the season list.<\/div>`; return; }\n      host.innerHTML = top.map((e,i) =>\n        `<div class=\"bg-row\"><span class=\"pos\">${i+1}<\/span>\n          <span class=\"nm\">${escapeHtml(e.name)} <span style=\"color:var(--muted);font-weight:normal;\">(Wk ${e.wk})<\/span><\/span>\n          <span class=\"sc\">${e.score}<\/span><\/div>`\n      ).join(\"\");\n    }\n    function addBest() {\n      const nameEl = document.getElementById(\"bgName\");\n      const scoreEl = document.getElementById(\"bgScore\");\n      const name = nameEl.value.trim();\n      const score = parseInt(scoreEl.value, 10);\n      if (!name || isNaN(score)) return;\n      if (!state.best[activeWeek]) state.best[activeWeek] = [];\n      state.best[activeWeek].push({name, score});\n      nameEl.value = \"\"; scoreEl.value = \"\";\n      save(); renderBestList(); renderSeasonTop();\n    }\n\n    /* ---------- Team Stats ---------- */\n    let activeStatsTeam = null;\n\n    function teamStats() {\n      const data = {};\n      state.teams.forEach(t => data[t.id] = {id:t.id, name:t.name, gp:0, w:0, l:0, seq:[], s7:{w:0,l:0}, s8:{w:0,l:0}, h2h:{}});\n      state.teams.forEach(t => state.teams.forEach(o => { if (o.id!==t.id && data[t.id]) data[t.id].h2h[o.id]={w:0,l:0}; }));\n      state.games.forEach(g => {\n        if (g.money || g.w == null) return;\n        if (!data[g.a] || !data[g.b]) return;\n        const loser = g.w === g.a ? g.b : g.a;\n        [[g.w, loser, \"W\"], [loser, g.w, \"L\"]].forEach(([tid, opp, res]) => {\n          const d = da l(\".wk-btn\").forEach(btn =>\n        btn.addEventListener(\"click\", () => { activeBowler = {team:activeStatsTeam, idx:Number(btn.dataset.bidx)}; renderBowlers(); }));\n      renderBowlerCard();\n    }\n\n    function renderBowlerCard() {\n      const host = document.getElementById(\"bowlerCard\");\n      const team = state.teams.find(t => t.id === activeStatsTeam);\n      if (!team) { host.innerHTML = \"\"; return; }\n      const idx = activeBowler.idx;\n      const key = activeStatsTeam + \"-\" + idx;\n      if (!state.scores[key]) state.scores[key] = {};\n      const sc = state.scores[key];\n      const weeks = [...new Set(state.games.map(g=>g.wk))].sort((a,b)=>a-b);\n      const rows = weeks.map(wk => {\n        const arr = sc[wk] || [];\n        const g1 = (arr[0]!=null) ? arr[0] : \"\";\n        const g2 = (arr[1]!=null) ? arr[1] : \"\";\n        const has = arr[0]!=null || arr[1]!=null;\n        const wt = (Number(arr[0])||0) + (Number(arr[1])||0);\n        return `<tr><td>Wk ${wk}<\/td>\n          <td><input class=\"score-in\" data-wk=\"${wk}\" data-g=\"0\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"300\" value=\"${g1}\"><\/td>\n          <td><input class=\"score-in\" data-wk=\"${wk}\" data-g=\"1\" type=\"number\" inputmode=\"numeric\" min=\"0\" max=\"300\" value=\"${g2}\"><\/td>\n          <td class=\"wt\" data-wk=\"${wk}\">${has ? wt : \"\"}<\/td><\/tr>`;\n      }).join(\"\");\n      host.innerHTML = `\n        <input class=\"edit-name\" id=\"bowlerNameEdit\" value=\"${escapeHtml(team.bowlers[idx]||'')}\" style=\"max-width:260px;margin-bottom:10px;\">\n        <div style=\"overflow-x:auto;\">\n          <table><thead><tr><th>Week<\/th><th>7pm<\/th><th>8pm<\/th><th>Week Total<\/th><\/tr><\/thead>\n          <tbody>${rows}<\/tbody><\/table>\n        <\/div>\n        <div id=\"bowlerSummary\" style=\"margin-top:10px;font-size:15px;\"><\/div>`;\n\n      host.querySelectorAll(\".score-in\").forEach(inp => {\n        inp.addEventListener(\"input\", () => {\n          const wk = inp.dataset.wk, g = Number(inp.dataset.g);\n          if (!state.scores[key]) state.scores[key] = {};\n          if (!state.scores[key][wk]) state.scores[key][wk] = [];\n          let v = inp.value === \"\" ? null : parseInt(inp.value, 10);\n          if (v != null && !isNaN(v)) v = Math.max(0, Math.min(300, v));\n          state.scores[key][wk][g] = (v==null || isNaN(v)) ? null : v;\n          const arr = state.scores[key][wk];\n          const cell = host.querySelector(`.wt[data-wk=\"${wk}\"]`);\n          const has = arr[0]!=null || arr[1]!=null;\n          cell.textContent = has ? ((Number(arr[0])||0)+(Number(arr[1])||0)) : \"\";\n          updateBowlerSummary(key);\n          save();\n        });\n      });\n      const nameEdit = document.getElementById(\"bowlerNameEdit\");\n      nameEdit.addEventListener(\"input\", () => {\n        team.bowlers[idx] = nameEdit.value;\n        const b = document.querySelector(`#bowlerPicker .wk-btn[data-bidx=\"${idx}\"]`);\n        if (b) b.textContent = nameEdit.value || (\"Bowler \"+(idx+1));\n        save();\n      });\n      updateBowlerSummary(key);\n    }\n\n    function updateBowlerSummary(key) {\n      const sc = state.scores[key] || {};\n      let games=0, pins=0, high=0;\n      Object.values(sc).forEach(arr => (arr||[]).forEach(v => {\n        if (v != null && !isNaN(v)) { games++; pins += v; if (v > high) high = v; }\n      }));\n      const el = document.getElementById(\"bowlerSummary\");\n      if (!el) return;\n      el.innerHTML = games\n        ? `<b>Games:<\/b> ${games} &nbsp;&nbsp; <b>Total pins:<\/b> ${pins} &nbsp;&nbsp; <b>Average:<\/b> ${(pins/games).toFixed(1)} &nbsp;&nbsp; <b>High game:<\/b> ${high}`\n        : `<span class=\"empty\">Enter game scores above to see totals and average.<\/span>`;\n    }\n\n    /* ---------- helpers / wiring ---------- */\n    function escapeHtml(s){ return String(s).replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"     const scoreHtml = "<!doctype html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\">\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n  <meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n  <meta name=\"apple-mobile-web-app-status-bar-style\" content=\"default\">\n  <meta name=\"apple-mobile-web-app-title\" content=\"Beer League 2 Lanes\">\n  <title>Judges Beer League Score Sheet<\/title>\n  <style>\n    :root {\n      --ink: #162431;\n      --muted: #526679;\n      --line: #294156;\n      --paper: #ffffff;\n      --panel: #f5f8fb;\n      --accent: #123b5d;\n      --accent-2: #e4eef5;\n      --focus: #f3c76a;\n      --danger: #aa2834;\n    }\n\n    * { box-sizing: border-box; }\n\n    body {\n      margin: 0;\n      background: #eaf0f5;\n      color: var(--ink);\n      font-family: Arial, Helvetica, sans-serif;\n    }\n\n    .page {\n      max-width: 1400px;\n      margin: 24px auto;\n      background: var(--paper);\n      box-shadow: 0 3px 22px rgba(15, 34, 53, .12);\n      padding: 26px 28px 30px;\n    }\n\n    .titlebar {\n      display: flex;\n      justify-content: space-between;\n      align-items: end;\n      gap: 20px;\n      border-bottom: 4px solid var(--accent);\n      padding-bottom: 16px;\n      margin-bottom: 18px;\n    }\n\n    .league-logo {\n      display: block;\n      max-width: 620px;\n      width: 100%;\n      height: auto;\n      margin: 0 0 10px;\n    }\n\n    .title-stack {\n      display: flex;\n      flex-direction: column;\n      align-items: flex-start;\n    }\n\n    h1 {\n      margin: 0 0 5px;\n      font-size: 32px;\n      letter-spacing: .06em;\n      text-transform: uppercase;\n      color: var(--accent);\n    }\n\n    .subtitle {\n      color: var(--muted);\n      font-size: 14px;\n      margin: 0;\n    }\n\n    .bowling-mark {\n      min-width: 128px;\n      text-align: right;\n      color: var(--accent);\n      font-weight: 700;\n      font-size: 14px;\n      lett oll is a strike. Frame 10 accepts bonus rolls after a strike or spare.\n            Use digits 0\u20139, X, /, or - only. A perfect game scores 300.\n          <\/p>\n        <\/div>\n      <\/section>\n    <\/details>\n\n\n    <section class=\"mobile-keypad\" id=\"mobileKeypad\" aria-label=\"Bowling roll keypad\">\n      <div class=\"keypad-header\">\n        <span id=\"activeRollLabel\">Select a frame box to score<\/span>\n        <button class=\"secondary\" type=\"button\" data-key-action=\"done\">Done<\/button>\n      <\/div>\n      <div class=\"keypad-grid\">\n        <button class=\"mark\" type=\"button\" data-roll-value=\"X\">X<\/button>\n        <button class=\"mark\" type=\"button\" data-roll-value=\"/\">/<\/button>\n        <button class=\"mark\" type=\"button\" data-roll-value=\"-\">-<\/button>\n        <button class=\"control\" type=\"button\" data-key-action=\"clear\">Clear<\/button>\n\n        <button type=\"button\" data-roll-value=\"7\">7<\/button>\n        <button type=\"button\" data-roll-value=\"8\">8<\/button>\n        <button type=\"button\" data-roll-value=\"9\">9<\/button>\n        <button class=\"control\" type=\"button\" data-key-action=\"next\">Next<\/button>\n\n        <button type=\"button\" data-roll-value=\"4\">4<\/button>\n        <button type=\"button\" data-roll-value=\"5\">5<\/button>\n        <button type=\"button\" data-roll-value=\"6\">6<\/button>\n        <button class=\"control\" type=\"button\" data-key-action=\"previous\">Back<\/button>\n\n        <button type=\"button\" data-roll-value=\"1\">1<\/button>\n        <button type=\"button\" data-roll-value=\"2\">2<\/button>\n        <button type=\"button\" data-roll-value=\"3\">3<\/button>\n        <button class=\"control\" type=\"button\" data-key-action=\"done\">Close<\/button>\n      <\/div>\n    <\/section>\n\n    <footer class=\"footer\">\n      <span>Standard Ten-Pin Bowling Scorecard<\/span>\n      <span class=\"screen-only\">Your entries are saved automatically in this browser.<\/span>\n    <\/footer>\n  <\/main>\n\n  <script>\n    (() => {\n      const STORAGE_KEY = \"judgesBeerLeague_twoLaneCurrentSheet_v1\";\n      const SAVED_GAMES_KEY = \"judgesBeerLeague_twoLaneSavedGames_v1\";\n      let activeGameId = null;\n      let gameDirty = false;\n      const laneBodies = [\"scoreBody\", \"scoreBody2\"].map(id => document.getElementById(id)).filter(Boolean);\n      const body = laneBodies[0];\n      const mq = q => (typeof window.matchMedia === \"function\" ? window.matchMedia(q).matches : false);\n      const defaultBowlers = 4;\n      let rowCount = defaultBowlers;\n\n      const clean = value => {\n        let v = (value || \"\").trim().toUpperCase();\n        if (v === \"0\") v = \"-\";\n        return [\"X\", \"/\", \"-\", \"1\", \"2\", \"3\", \"4\", \"5\", \"6\", \"7\", \"8\", \"9\"].includes(v) ? v : \"\";\n      };\n\n      const rollValue = (token, previous = 0) => {\n        if (token === \"X\") return 10;\n        if (token === \"/\") return 10 - previous;\n        if (token === \"-\" || token === \"\") return 0;\n        return Number(token);\n      };\n\n      function buildRow(index, existing = {}) {\n        const tr = document.createElement(\"tr\");\n        tr.className = \"bowler-row\";\n        tr.dataset.row = index;\n\n        const player = document.createElement(\"td\");\n        player.className = \"player-cell\";\n        player.innerHTML = `<input class=\"player-name\" type=\"text\" aria-label=\"Bowler ${index + 1} name\" placeholder=\"Bowler ${index + 1}\" value=\"${escapeHtml(existing.name || \"\")}\">`;\n        tr.appendChild(player);\n\n        const storedRolls = existing.rolls || [];\n        let inputIndex = 0;\n        for (let frame = 1; frame <= 10; frame++) {\n          const td = document.createElement(\"td\");\n          const isTenth = frame === 10;\n          td.innerHTML = `\n            <div class=\"frame ${isTenth ? \"tenth\" : \"\"}\">\n              <div class=\"throws\"><\/div>\n              <div class=\"score\" data-frame-score=\"${frame}\"><\/div>\n            <\/div>`;\n          const throws = td.querySelector(\".throws\");\n          const rollsInFrame = isTenth ? 3 : 2;\n          for (let r = 0; r < rollsInFrame; r++, inputIndex++) {\n            const roll = document.createElement(\"input\");\n            roll.className = \"roll\";\n            roll.type = \"text\";\n            roll.maxLength = 1;\n            roll.autocomplete = \"off\";\n            roll.spellcheck = false;\n            roll.dataset.frame = frame;\n            roll.dataset.roll = r + 1;\n            roll.setAttribute(\"aria-label\", `Bowler ${index + 1}, frame ${frame}, roll ${r + 1}`);\n            roll.value = storedRolls[inputIndex] || \"\";\n            throws.appendChild(roll);\n          }\n          tr.appendChild(td);\n        }\n\n        const total = document.createElement(\"td\");\n        total.innerHTML = `<div class=\"grand-total\" aria-label=\"Bowler ${index + 1} total\"><\/div>`;\n        tr.appendChild(total);\n\n        tr.querySelector(\".player-name\").addEventListener(\"input\", saveState);\n        tr.querySelectorAll(\".roll\").forEach(input => {\n          input.addEventListener(\"input\", handleRollInput);\n          input.addEventListener(\"keydown\", handleNavigation);\n        });\n\n        return tr;\n      }\n\n      function escapeHtml(str) {\n        return String(str).replace(/[&<>\"']/g, char => ({\n          \"&\": \"&amp;\", \"<\": \"&lt;\", \">\": \"&gt;\", '\"': \"&quot;\", \"'\": \"&#39;\"\n        }[char]));\n      }\n\n      function addRow(existing = {}) {\n        const row = buildRow(rowCount, existing);\n        body.appendChild(row);\n        rowCount++;\n        updateAllScores();\n      }\n\n      function resetRows(lanes = []) {\n        // Accept [[lane1Rows],[lane2Rows]] or legacy [rows]\n        const laneData = Array.isArray(lanes[0]) ? lanes : [lanes];\n        laneBodies.forEach((laneBody, li) => {\n          laneBody.innerHTML = \"\";\n          const rows = laneData[li] || [];\n          for (let i = 0; i < defaultBowlers; i++) {\n            laneBody.appendChild(buildRow(i, rows[i] || {}));\n          }\n        });\n        updateAllScores();\n      }\n\n      function handleRollInput(event) {\n        const input = event.target;\n        const original = input.value;\n        input.value = clean(input.value.slice(-1));\n        const row = input.closest(\"tr\");\n\n        validateFrameEntry(row, input);\n\n        updateRowScore(row);\n        saveState();\n\n        if (input.value && original) {\n          const fields = Array.from(row.querySelectorAll(\".roll\"));\n          let next = fields.indexOf(input) + 1;\n          while (fields[next] && fields[next].disabled) next++;\n          if (fields[next]) fields[next].focus();\n        }\n      }\n\n      function validateFrameEntry(row, changed) {\n        const frame = Number(changed.dataset.frame);\n        const inputs = Array.from(row.querySelectorAll(`.roll[data-frame=\"${frame}\"]`));\n        const a = clean(inputs[0].value);\n        const b = clean(inputs[1].value);\n        const c = inputs[2] ? clean(inputs[2].value) : \"\";\n\n        if (frame < 10) {\n          if (changed === inputs[0] && a === \"/\") inputs[0].value = \"\";\n          const isStrike = clean(inputs[0].value) === \"X\";\n          inputs[1].disabled = isStrike;\n          if (isStrike) inputs[1].value = \"\";\n          if (!isStrike && b === \"X\") inputs[1].value = \"\";\n          if (!isStrike && clean(inputs[0].value) && b && b !== \"/\" &&\n              rollValue(clean(inputs[0].value)) + rollValue(b) >= 10) {\n            inputs[1].value = \"/\";\n          }\n          if (!clean(inputs[0].value) && b === \"/\") inputs[1].value = \"\";\n        } else {\n          if (a === \"/\") inputs[0].value = \"\";\n          if (a !== \"X\" && b === \"X\") inputs[1].value = \"\";\n          if (a !== \"X\" && a && b && b !== \"/\" && rollValue(a) + rollValue(b) >= 10) {\n            inputs[1].value = \"/\";\n          }\n          const av = clean(inputs[0].value);\n          const bv = clean(inputs[1].value);\n          const cv = clean(inputs[2].value);\n          const bonusAllowed = av === \"X\" || bv === \"/\";\n          if (!bonusAllowed) inputs[2].value = \"\";\n          if (av === \"X\" && bv === \"/\") inputs[1].value = \"\";\n          if (av === \"X\" && bv && bv !== \"X\" && cv &&\n              (cv === \"X\" || (cv !== \"/\" && rollValue(bv) + rollValue(cv) >= 10))) {\n            inputs[2].value = \"/\";\n          }\n          if ((bv === \"/\" || (av === \"X\" && bv === \"X\")) && cv === \"/\") inputs[2].value = \"\";\n          if (av !== \"X\" && !av && bv === \"/\") inputs[1].value = \"\";\n        }\n      }\n\n      function getFrames(row) {\n        const frameInputs = frame => Array.from(row.querySelectorAll(`.roll[data-frame=\"${frame}\"]`)).map(i => clean(i.value));\n        return Array.from({ length: 10 }, (_, i) => frameInputs(i + 1));\n      }\n\n      function scoringData(row) {\n        const frames = getFrames(row);\n        const rolls = [];\n        const marks = [];\n        let sequential = true;\n\n        for (let f = 0; f < 9; f++) {\n          const [a, b] = frames[f];\n          const start = rolls.length;\n          if (!sequential || !a) {\n            sequential = false;\n            marks.push({ start, complete: false });\n            continue;\n          }\n          if (a === \"X\") {\n            rolls.push(10);\n            marks.push({ start, type: \"strike\", complete: true });\n          } else if (b) {\n            const first = rollValue(a);\n            rolls.push(first);\n            if (b === \"/\") {\n              rolls.push(10 - first);\n              marks.push({ start, type: \"spare\", complete: true });\n            } else {\n              rolls.push(rollValue(b));\n              marks.push({ start, type: \"open\", complete: true });\n            }\n          } else {\n            rolls.push(rollValue(a));\n            marks.push({ start, complete: false });\n            sequential = false;\n          }\n        }\n\n        const tenth = frames[9];\n        const tenthStart = rolls.length;\n        let tenthComplete = false;\n        if (sequential && tenth[0]) {\n          const first = rollValue(tenth[0]);\n          rolls.push(first);\n          if (tenth[1]) {\n            const second = tenth[1] === \"/\" ? 10 - first : rollValue(tenth[1]);\n            rolls.push(second);\n            const bonusRequired = tenth[0] === \"X\" || tenth[1] === \"/\";\n            if (bonusRequired) {\n              if (tenth[2]) {\n                const thirdPrevious = tenth[1] === \"X\" ? 10 : second;\n                rolls.push(tenth[2] === \"/\" ? 10 - thirdPrevious : rollValue(tenth[2]));\n                tenthComplete = true;\n              }\n            } else {\n              tenthComplete = true;\n            }\n          }\n        }\n        marks.push({ start: tenthStart, type: \"tenth\", complete: tenthComplete });\n\n        return { rolls, marks };\n      }\n\n      function updateRowScore(row) {\n        for (let frame = 1; frame <= 9; frame++) {\n          const inputs = Array.from(row.querySelectorAll(`.roll[data-frame=\"${frame}\"]`));\n          const isStrike = clean(inputs[0].value) === \"X\";\n          inputs[1].disabled = isStrike;\n          if (isStrike) inputs[1].value = \"\";\n        }\n        const { rolls, marks } = scoringData(row);\n        const scoreCells = Array.from(row.querySelectorAll(\".score\"));\n        let total = 0;\n        let lastScoredTotal = \"\";\n\n        for (let f = 0; f < 9; f++) {\n          const mark = marks[f];\n          let frameScore = null;\n          if (mark.complete && mark.type === \"strike\" && rolls.length > mark.start + 2) {\n            frameScore = 10 + rolls[mark.start + 1] + rolls[mark.start + 2];\n          } else if (mark.complete && mark.type === \"spare\" && rolls.length > mark.start + 2) {\n            frameScore = 10 + rolls[mark.start + 2];\n          } else if (mark.complete && mark.type === \"open\") {\n            frameScore = rolls[mark.start] + rolls[mark.start + 1];\n          }\n          if (frameScore === null) {\n            scoreCells[f].textContent = \"\";\n          } else {\n            total += frameScore;\n            scoreCells[f].textContent = total;\n            lastScoredTotal = total;\n          }\n        }\n\n        const tenth = marks[9];\n        if (tenth.complete) {\n          const tenthPins = rolls.slice(tenth.start).reduce((sum, n) => sum + n, 0);\n          total += tenthPins;\n          scoreCells[9].textContent = total;\n          lastScoredTotal = total;\n        } else {\n          scoreCells[9].textContent = \"\";\n        }\n        row.querySelector(\".grand-total\").textContent = lastScoredTotal;\n      }\n\n      function updateAllScores() {\n        document.querySelectorAll(\".bowler-row\").forEach(updateRowScore);\n      }\n\n      function handleNavigation(event) {\n        const row = event.target.closest(\"tr\");\n        const inputs = Array.from(row.querySelectorAll(\".roll\"));\n        const position = inputs.indexOf(event.target);\n        if (event.key === \"ArrowRight\" && inputs[position + 1]) {\n          inputs[position + 1].focus();\n        } else if (event.key === \"ArrowLeft\" && inputs[position - 1]) {\n          inputs[position - 1].focus();\n        }\n      }\n\n      function collectState() {\n        const laneRows = laneBodies.map(laneBody =>\n          Array.from(laneBody.querySelectorAll(\".bowler-row\")).map(row => ({\n            name: row.querySelector(\".player-name\").value,\n            rolls: Array.from(row.querySelectorAll(\".roll\")).map(r => r.value)\n          }))\n        );\n        const meta = {};\n        document.querySelectorAll(\".saved-meta\").forEach(input => meta[input.id] = input.value);\n        return { lanes: laneRows, rows: laneRows[0] || [], meta, activeGameId };\n      }\n\n      function saveState(markDirty = true) {\n        if (markDirty && activeGameId) gameDirty = true;\n        localStorage.setItem(STORAGE_KEY, JSON.stringify(collectState()));\n        updateSaveStatus();\n      }\n\n      function applyState(state, savedId = null) {\n        document.querySelectorAll(\".saved-meta\").forEach(input => input.value = \"\");\n        const laneData = state && state.lanes ? state.lanes : (state && state.rows ? [state.rows] : []);\n        resetRows(laneData);\n        configureMobileEntry();\n        if (state && state.meta) {\n          Object.keys(state.meta).forEach(key => {\n            const el = document.getElementById(key);\n            if (el) el.value = state.meta[key];\n          });\n        }\n        if (!document.getElementById(\"date\").value) {\n          document.getElementById(\"date\").value = new Date().toISOString().slice(0, 10);\n        }\n        activeGameId = savedId || (state && state.activeGameId) || null;\n        gameDirty = false;\n        updateAllScores();\n        saveState(false);\n      }\n\n      function loadState() {\n        let state;\n        try {\n          state = JSON.parse(localStorage.getItem(STORAGE_KEY) || \"null\");\n        } catch (e) {\n          state = null;\n        }\n        applyState(state);\n      }\n\n      function getSavedGames() {\n        try {\n          const games = JSON.parse(localStorage.getItem(SAVED_GAMES_KEY) || \"[]\");\n          return Array.isArray(games) ? games : [];\n        } catch (e) {\n          return [];\n        }\n      }\n\n      function storeSavedGames(games) {\n        localStorage.setItem(SAVED_GAMES_KEY, JSON.stringify(games));\n      }\n\n      function suggestedGameName() {\n        const date = document.getElementById(\"date\").value || \"Undated\";\n        const game = document.getElementById(\"game\").value.trim();\n        const lane = document.getElementById(\"lane\").value.trim();\n        const pieces = [date];\n        if (game) pieces.push(`Game ${game}`);\n        if (lane) pieces.push(`Lane ${lane}`);\n        return pieces.join(\" - \");\n      }\n\n      function updateSaveStatus() {\n        const status = document.getElementById(\"saveStatus\");\n        if (!status) return;\n        const record = getSavedGames().find(game => game.id === activeGameId);\n        status.classList.remove(\"saved\", \"dirty\");\n        if (!record) {\n          status.textContent = \"Current game not saved\";\n          return;\n        }\n        if (gameDirty) {\n          status.textContent = `Unsaved changes: ${record.name}`;\n          status.classList.add(\"dirty\");\n        } else {\n          status.textContent = `Saved: ${record.name}`;\n          status.classList.add(\"saved\");\n        }\n      }\n\n      function saveGameRecord() {\n        const games = getSavedGames();\n        const current = games.find(game => game.id === activeGameId);\n\n        if (current) {\n          current.state = collectState();\n          current.state.activeGameId = current.id;\n          current.savedAt = new Date().toISOString();\n          gameDirty = false;\n          storeSavedGames(games);\n          saveState(false);\n          renderSavedGames();\n          alert(`Game updated: ${current.name}`);\n          return;\n        }\n\n        const proposed = suggestedGameName();\n        const entered = prompt(\"Save this game as:\", proposed);\n        if (entered === null) return;\n\n        const record = {\n          id: `game_${Date.now()}`,\n          name: entered.trim() || proposed,\n          savedAt: new Date().toISOString(),\n          state: collectState()\n        };\n        activeGameId = record.id;\n        record.state.activeGameId = record.id;\n        games.unshift(record);\n        storeSavedGames(games);\n        gameDirty = false;\n        saveState(false);\n        renderSavedGames();\n        alert(`Game saved: ${record.name}`);\n      }\n\n      function formatSavedAt(isoText) {\n        const date = new Date(isoText);\n        return Number.isNaN(date.getTime()) ? \"\" : date.toLocaleString();\n      }\n\n      function renderSavedGames() {\n        const container = document.getElementById(\"savedGamesList\");\n        const games = getSavedGames().sort((a, b) => (b.savedAt || \"\").localeCompare(a.savedAt || \"\"));\n        container.innerHTML = \"\";\n\n        if (!games.length) {\n          const empty = document.createElement(\"div\");\n          empty.className = \"saved-game-empty\";\n          empty.textContent = \"No saved games yet. Enter scores and press Save Game.\";\n          container.appendChild(empty);\n          return;\n        }\n\n        games.forEach(game => {\n          const row = document.createElement(\"div\");\n          row.className = \"saved-game-row\";\n\n          const info = document.createElement(\"div\");\n          const title = document.createElement(\"span\");\n          title.className = \"saved-game-title\";\n          title.textContent = game.name || \"Saved Game\";\n          const details = document.createElement(\"div\");\n          details.className = \"saved-game-details\";\n          const meta = (game.state && game.state.meta) || {};\n          const detailParts = [];\n          if (meta.date) detailParts.push(meta.date);\n          if (meta.game) detailParts.push(`Game ${meta.game}`);\n          if (meta.lane) detailParts.push(`Lane ${meta.lane}`);\n          if (game.savedAt) detailParts.push(`Saved ${formatSavedAt(game.savedAt)}`);\n          details.textContent = detailParts.join(\" \u2022 \");\n          info.append(title, details);\n\n          const actions = document.createElement(\"div\");\n          actions.className = \"saved-game-actions\";\n\n          const loadButton = document.createElement(\"button\");\n          loadButton.type = \"button\";\n          loadButton.textContent = \"Load\";\n          loadButton.addEventListener(\"click\", () => {\n            if (!confirm(`Load \"${game.name}\"? The current sheet will be replaced.`)) return;\n            applyState(game.state || {}, game.id);\n            document.getElementById(\"savedGamesPanel\").hidden = true;\n          });\n\n          const downloadButton = document.createElement(\"button\");\n          downloadButton.type = \"button\";\n          downloadButton.className = \"secondary\";\n          downloadButton.textContent = \"Download\";\n          downloadButton.addEventListener(\"click\", () => downloadGame(game));\n\n          const deleteButton = document.createElement(\"button\");\n          deleteButton.type = \"button\";\n          deleteButton.className = \"danger\";\n          deleteButton.textContent = \"Delete\";\n          deleteButton.addEventListener(\"click\", () => {\n            if (!confirm(`Delete saved game \"${game.name}\"?`)) return;\n            const remaining = getSavedGames().filter(saved => saved.id !== game.id);\n            storeSavedGames(remaining);\n            if (activeGameId === game.id) {\n              activeGameId = null;\n              gameDirty = false;\n              saveState(false);\n            }\n            renderSavedGames();\n          });\n\n          actions.append(loadButton, downloadButton, deleteButton);\n          row.append(info, actions);\n          container.appendChild(row);\n        });\n      }\n\n      function downloadGame(game) {\n        const payload = {\n          app: \"Judges Beer League Score Sheet\",\n          version: 1,\n          exportedAt: new Date().toISOString(),\n          game\n        };\n        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: \"application/json\" });\n        const link = document.createElement(\"a\");\n        const safeName = (game.name || \"judges_game\").replace(/[^a-z0-9_-]+/gi, \"_\").replace(/^_+|_+$/g, \"\");\n        link.href = URL.createObjectURL(blob);\n        link.download = `${safeName || \"judges_game\"}.json`;\n        document.body.appendChild(link);\n        link.click();\n        link.remove();\n        setTimeout(() => URL.revokeObjectURL(link.href), 500);\n      }\n\n      function importGameFile(file) {\n        const reader = new FileReader();\n        reader.onload = event => {\n          try {\n            const payload = JSON.parse(event.target.result);\n            const incoming = payload.game || payload;\n            if (!incoming || !incoming.state || !Array.isArray(incoming.state.rows)) {\n              throw new Error(\"Invalid game file\");\n            }\n            const games = getSavedGames();\n            const imported = {\n              id: `game_${Date.now()}`,\n              name: incoming.name || \"Imported Game\",\n              savedAt: new Date().toISOString(),\n              state: incoming.state\n            };\n            imported.state.activeGameId = imported.id;\n            games.unshift(imported);\n            storeSavedGames(games);\n            renderSavedGames();\n            document.getElementById(\"savedGamesPanel\").hidden = false;\n            if (confirm(`Imported \"${imported.name}\". Load it now?`)) {\n              applyState(imported.state, imported.id);\n              document.getElementById(\"savedGamesPanel\").hidden = true;\n            }\n          } catch (error) {\n            alert(\"That file could not be imported as a Judges Beer League game.\");\n          }\n        };\n        reader.readAsText(file);\n      }\n\n\n\n\n      let activeRollInput = null;\n\n      function mobileEntryEnabled() {\n        return false; // use the device's full keyboard for entry\n      }\n\n      function configureMobileEntry() {\n        const enabled = mobileEntryEnabled();\n        document.querySelectorAll(\".roll\").forEach(input => {\n          input.readOnly = enabled;\n          input.inputMode = enabled ? \"none\" : \"text\";\n        });\n        if (!enabled) closeMobileKeypad();\n      }\n\n      function describeRollInput(input) {\n        const row = input.closest(\"tr\");\n        const name = row.querySelector(\".player-name\").value.trim() ||\n          row.querySelector(\".player-name\").placeholder;\n        return `${name} \u2022 Frame ${input.dataset.frame} \u2022 Roll ${input.dataset.roll}`;\n      }\n\n      function activateMobileRoll(input) {\n        if (!mobileEntryEnabled() || !input || input.disabled) return;\n        document.querySelectorAll(\".roll.mobile-active\").forEach(field => field.classList.remove(\"mobile-active\"));\n        activeRollInput = input;\n        activeRollInput.classList.add(\"mobile-active\");\n        document.getElementById(\"activeRollLabel\").textContent = describeRollInput(activeRollInput);\n        document.getElementById(\"mobileKeypad\").classList.add(\"show\");\n      }\n\n      function closeMobileKeypad() {\n        document.getElementById(\"mobileKeypad\").classList.remove(\"show\");\n        document.querySelectorAll(\".roll.mobile-active\").forEach(field => field.classList.remove(\"mobile-active\"));\n        activeRollInput = null;\n      }\n\n      function moveMobileSelection(direction) {\n        if (!activeRollInput) return;\n        const fields = Array.from(activeRollInput.closest(\"tr\").querySelectorAll(\".roll\"))\n          .filter(field => !field.disabled);\n        const current = fields.indexOf(activeRollInput);\n        const next = fields[current + direction];\n        if (next) {\n          next.focus();\n          activateMobileRoll(next);\n        }\n      }\n\n      function enterMobileRoll(value) {\n        if (!activeRollInput || activeRollInput.disabled) return;\n        const input = activeRollInput;\n        input.value = value;\n        input.dispatchEvent(new Event(\"input\", { bubbles: true }));\n        const focused = document.activeElement;\n        if (focused && focused.classList && focused.classList.contains(\"roll\") && !focused.disabled) {\n          activateMobileRoll(focused);\n        } else if (!input.disabled) {\n          activateMobileRoll(input);\n        }\n      }\n\n      document.addEventListener(\"focusin\", event => {\n        if (event.target.classList && event.target.classList.contains(\"roll\")) {\n          activateMobileRoll(event.target);\n        }\n      });\n\n      document.getElementById(\"mobileKeypad\").addEventListener(\"click\", event => {\n        const button = event.target.closest(\"button\");\n        if (!button) return;\n        if (button.dataset.rollValue) {\n          enterMobileRoll(button.dataset.rollValue);\n          return;\n        }\n        if (button.dataset.keyAction === \"clear\" && activeRollInput) {\n          activeRollInput.value = \"\";\n          activeRollInput.dispatchEvent(new Event(\"input\", { bubbles: true }));\n          activateMobileRoll(activeRollInput);\n        } else if (button.dataset.keyAction === \"next\") {\n          moveMobileSelection(1);\n        } else if (button.dataset.keyAction === \"previous\") {\n          moveMobileSelection(-1);\n        } else if (button.dataset.keyAction === \"done\") {\n          closeMobileKeypad();\n        }\n      });\n\n      window.addEventListener(\"resize\", configureMobileEntry);\n\n      document.getElementById(\"saveGame\").addEventListener(\"click\", saveGameRecord);\n\n      document.getElementById(\"viewSavedGames\").addEventListener(\"click\", () => {\n        renderSavedGames();\n        document.getElementById(\"savedGamesPanel\").hidden = false;\n      });\n\n      document.getElementById(\"closeSavedGames\").addEventListener(\"click\", () => {\n        document.getElementById(\"savedGamesPanel\").hidden = true;\n      });\n\n      document.getElementById(\"importGame\").addEventListener(\"click\", () => {\n        document.getElementById(\"importFile\").click();\n      });\n\n      document.getElementById(\"importFile\").addEventListener(\"change\", event => {\n        const file = event.target.files[0];\n        if (file) importGameFile(file);\n        event.target.value = \"\";\n      });\n\n      document.getElementById(\"clearSheet\").addEventListener(\"click\", () => {\n        if (!confirm(\"Clear all names, scores, and game information?\")) return;\n        localStorage.removeItem(STORAGE_KEY);\n        activeGameId = null;\n        gameDirty = false;\n        document.querySelectorAll(\".saved-meta\").forEach(input => input.value = \"\");\n        document.getElementById(\"date\").value = new Date().toISOString().slice(0, 10);\n        resetRows();\n        configureMobileEntry();\n        closeMobileKeypad();\n        saveState(false);\n      });\n\n      document.querySelectorAll(\".saved-meta\").forEach(input => input.addEventListener(\"input\", saveState));\n      loadState();\n      configureMobileEntry();\n\n      function setGameInfoDefault() {\n        const details = document.getElementById(\"gameInfo\");\n        if (!details) return;\n        if (mq(\"(min-width: 901px)\")) {\n          details.open = true;\n        }\n      }\n\n      setGameInfoDefault();\n      window.addEventListener(\"resize\", setGameInfoDefault);\n\n    })();\n  <\/script>\n<\/body>\n<\/html>";

    const leagueFrame = document.getElementById('leagueFrame');
    const scoreFrame = document.getElementById('scoreFrame');
    leagueFrame.srcdoc = leagueHtml;
    scoreFrame.srcdoc = scoreHtml;

    const btnLeague = document.getElementById('btnLeague');
    const btnScore = document.getElementById('btnScore');
    const leagueWrap = document.getElementById('leagueWrap');
    const scoreWrap = document.getElementById('scoreWrap');

    function show(which) {
      const leagueOn = which === 'league';
      btnLeague.classList.toggle('active', leagueOn);
      btnScore.classList.toggle('active', !leagueOn);
      leagueWrap.classList.toggle('active', leagueOn);
      scoreWrap.classList.toggle('active', !leagueOn);
      document.title = leagueOn ? 'Judges Beer League - League Manager' : 'Judges Beer League - Score Sheet';
      location.hash = leagueOn ? 'league' : 'score';
    }

    btnLeague.addEventListener('click', () => show('league'));
    btnScore.addEventListener('click', () => show('score'));
    document.getElementById('btnPrint').addEventListener('click', () => {
      const current = leagueWrap.classList.contains('active') ? leagueFrame : scoreFrame;
      try { current.contentWindow.focus(); current.contentWindow.print(); }
      catch (e) { window.print(); }
    });

    if (location.hash.replace('#','') === 'score') show('score');
  </script>
